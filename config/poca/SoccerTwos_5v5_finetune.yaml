behaviors:
  SoccerTwos:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048 # Podrías aumentarlo si aumentas buffer_size y tienes memoria
      buffer_size: 40960 # Aumentar para más diversidad de experiencias en 5v5
      learning_rate: 0.00005 # Reducir significativamente para fine-tuning
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant # Considera 'linear_decay' para fine-tuning largo
    network_settings:
      normalize: false
      hidden_units: 512 # Considera aumentar a 768 o 1024 si el rendimiento no mejora
      num_layers: 2     # Podrías probar con 3 capas si aumentas hidden_units
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 2.0
      #  GAIL NO COMPATIBLE CON POCA. PUEDE PROVOCAR RESULTADOS INESPERADOS
      #gail:
      #  strength: 0.1
      #  demo_path: D:\\UnityProjects\\Unity-Soccer-RL\\Project\\demos\\te3demo.demo
    #behavioral_cloning:
    #  demo_path: D:\\UnityProjects\\Unity-Soccer-RL\\Project\\demos\\te3demo.demo
    #  strength: 0.1
    keep_checkpoints: 5
    max_steps: 100000000 # O el número de pasos deseado para el fine-tuning
    time_horizon: 3000 # Aumentar si los episodios 5v5 son más largos o requieren más estrategia
    summary_freq: 10000 # Mantener o ajustar según necesidad
    self_play:
      save_steps: 50000
      team_change: 200000 # Estos podrían necesitar ajuste si la "duración" de un juego 5v5 es diferente
      swap_steps: 2000    #
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

