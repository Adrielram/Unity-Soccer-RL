behaviors:
  SoccerTwos:  # New behavior name for 5v5
    trainer_type: poca
    hyperparameters:
      batch_size: 8192  # Increased from 2048 to handle more agents
      buffer_size: 81920  # Increased from 20480 to handle more agents
      learning_rate: 0.0002
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 768  # Increased from 512 for more complex coordination
      num_layers: 3  # Increased from 2 for more complex coordination
      vis_encode_type: simple
      #memory:
        #sequence_length: 64  # for longer sequences # stamina_mem_1.onnx
        #memory_size: 256  # for more complex coordination #stamina_mem_1.onnx
        # nuevos valores porque no juegan muy bien:
        #sequence_length: 16  # Reduced for faster convergence
        #memory_size: 64  # Reduced for faster convergence
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 2.0
    keep_checkpoints: 5
    max_steps: 100000000  # Increased from 100000000 to allow for longer training
    # MAX_STEPS BAJO A 30M. ESTABA EN 150M. HAY PARAMETROS QUE CAMBIAN DEPENDIENDO DE ESTO....
    # ENTENDER COMO PUEDE HABER AFECTADO AL ENTRENAMIENTO
    time_horizon: 3000  # Increased from 2000 to capture longer-term dependencies
    summary_freq: 10000
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 15  # Increased from 10 to maintain more past policies
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
environment_parameters:
  ball_touch:
    curriculum:
      - name: ball_touch_1
        completion_criteria:
          measure: progress
          behavior: SoccerTwos
          signal_smoothing: false
          min_lesson_length: 0
          threshold: 0.06    
        value: 0.5
      - name: ball_touch_2
        completion_criteria:
          measure: progress
          behavior: SoccerTwos
          signal_smoothing: false
          min_lesson_length: 0
          threshold: 0.12    
        value: 0.4
      - name: ball_touch_3
        completion_criteria:
          measure: progress
          behavior: SoccerTwos
          signal_smoothing: false
          min_lesson_length: 0
          threshold: 0.18
        value: 0.3
      - name: ball_touch_4
        completion_criteria:
          measure: progress
          behavior: SoccerTwos
          signal_smoothing: false
          min_lesson_length: 0
          threshold: 0.24
        value: 0.2
      - name: ball_touch_5
        completion_criteria:
          measure: progress
          behavior: SoccerTwos
          signal_smoothing: false
          min_lesson_length: 0
          threshold: 0.3
        value: 0.1
      - name: ball_touch_6
        # Esta lección se activa a partir de 20 M + epsilon
        value: 0.0
  # en C# no se utilizan:
  field_scale: 1.0  # Adjust field size
  agent_speed: 1.0  # Adjust agent movement speed
  ball_size: 1.0    # Adjust ball size
  max_steps: 25000  # Maximum steps per episode
  goal_reward: 1.0  # Reward for scoring a goal
  defense_reward: 0.1  # Reward for successful defense
  pass_reward: 0.15  # Reward for successful passes
