behaviors:
  SoccerTwos:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0002
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 2.0
      #  GAIL NO COMPATIBLE CON POCA. PUEDE PROVOCAR RESULTADOS INESPERADOS
      #gail:
      #  strength: 0.1
      #  demo_path: D:\UnityProjects\Unity-Soccer-RL\Project\demos\te3demo.demo
    #behavioral_cloning:
    #  demo_path: D:\UnityProjects\Unity-Soccer-RL\Project\demos\te3demo.demo
    #  strength: 0.1
    keep_checkpoints: 5
    max_steps: 100000000
    time_horizon: 2000
    summary_freq: 50000