behaviors:
  SoccerTwos:
    trainer_type: sac
    hyperparameters:
      learning_rate: 0.001
      learning_rate_schedule: constant
      batch_size: 1024
      buffer_size: 50000
      buffer_init_steps: 500
      tau: 0.01
      steps_per_update: 4.0
      save_replay_buffer: false
      init_entcoef: 0.01
      reward_signal_steps_per_update: 4.0
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 64
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    keep_checkpoints: 3
    max_steps: 20000000
    time_horizon: 1000
    summary_freq: 5000
    threaded: true
    self_play:
      save_steps: 25000
      team_change: 100000
      swap_steps: 1000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

env_settings:
  env_path: "D:/UnityProjects/Unity-Soccer-RL/Project/Builds/UnityEnvironment.exe"
  env_args: null
  base_port: 5005
  num_envs: 4
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60

engine_settings:
  width: 84
  height: 84
  quality_level: 0
  time_scale: 50
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
  no_graphics_monitor: false

environment_parameters: null

checkpoint_settings:
  run_id: SoccerTwos_SAC
  initialize_from: null
  load_model: false
  resume: false
  force: false
  train_model: true
  inference: false
  results_dir: results

torch_settings:
  device: cuda

debug: false
